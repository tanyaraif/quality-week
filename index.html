<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Неделя качества — Лаборатория</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <!-- Пузырьки на фоне -->
        <canvas class="bubbles-canvas" id="bubbles-canvas"></canvas>

        <div class="container">
            <header>
                <div class="logo">
                    <div class="logo-icon">
                        <svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path
                                d="M9 3h6M9 3v6l-4 9a1 1 0 0 0 .9 1.4h12.2a1 1 0 0 0 .9-1.4L15 9V3"
                            />
                            <path d="M6.5 15h11" />
                        </svg>
                    </div>
                    <div class="logo-text">Неделя <span>качества</span></div>
                </div>
                <nav class="nav">
                    <button id="nav-register" class="active">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path
                                d="M9 3h6M9 3v6l-4 9a1 1 0 0 0 .9 1.4h12.2a1 1 0 0 0 .9-1.4L15 9V3"
                            />
                            <path d="M6.5 15h11" />
                        </svg>
                        <span>Записаться</span>
                    </button>
                    <button id="nav-schedule">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <rect x="3" y="4" width="18" height="18" rx="2" />
                            <path d="M3 10h18M8 2v4M16 2v4" />
                        </svg>
                        <span>Активности</span>
                    </button>
                    <button id="nav-mine">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M9 11l3 3L22 4" />
                            <path
                                d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"
                            />
                        </svg>
                        <span>Мои записи</span>
                    </button>
                </nav>
            </header>

            <main>
                <section id="view-register"></section>
                <section id="view-schedule" class="hidden"></section>
                <section id="view-mine" class="hidden"></section>
            </main>
        </div>

        <div id="modal-root"></div>

        <script>
            // ── Всплывающие реагенты ──────────────────────────────────────────────
            (function () {
                const reduce = window.matchMedia(
                    "(prefers-reduced-motion: reduce)",
                ).matches;
                if (reduce) return;

                const canvas = document.getElementById("bubbles-canvas");
                const ctx = canvas.getContext("2d");
                const COLORS = [
                    [110, 231, 183], // кислотно-зелёный
                    [244, 114, 182], // маджента
                    [251, 191, 36], // янтарь
                    [96, 165, 250], // лазурь
                ];
                let bubbles = [];
                let W, H;

                function resize() {
                    W = canvas.width = window.innerWidth;
                    H = canvas.height = window.innerHeight;
                }
                resize();
                window.addEventListener("resize", resize);

                function makeBubble() {
                    return {
                        x: Math.random() * W,
                        y: H + 30,
                        r: 3 + Math.random() * 12,
                        speed: 0.2 + Math.random() * 0.5,
                        drift: (Math.random() - 0.5) * 0.3,
                        alpha: 0.18 + Math.random() * 0.3,
                        color: COLORS[
                            Math.floor(Math.random() * COLORS.length)
                        ],
                        wobble: Math.random() * Math.PI * 2,
                        wobbleSpeed: 0.008 + Math.random() * 0.014,
                    };
                }

                for (let i = 0; i < 26; i++) {
                    const b = makeBubble();
                    b.y = Math.random() * H;
                    bubbles.push(b);
                }

                function draw() {
                    ctx.clearRect(0, 0, W, H);
                    for (const b of bubbles) {
                        b.y -= b.speed;
                        b.wobble += b.wobbleSpeed;
                        b.x += b.drift + Math.sin(b.wobble) * 0.4;

                        const [r, g, bl] = b.color;

                        // Свечение
                        const grad = ctx.createRadialGradient(
                            b.x,
                            b.y,
                            0,
                            b.x,
                            b.y,
                            b.r * 2.4,
                        );
                        grad.addColorStop(
                            0,
                            `rgba(${r}, ${g}, ${bl}, ${b.alpha * 0.5})`,
                        );
                        grad.addColorStop(1, `rgba(${r}, ${g}, ${bl}, 0)`);
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, b.r * 2.4, 0, Math.PI * 2);
                        ctx.fillStyle = grad;
                        ctx.fill();

                        // Контур пузырька
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                        ctx.strokeStyle = `rgba(${r}, ${g}, ${bl}, ${b.alpha + 0.2})`;
                        ctx.lineWidth = 1.3;
                        ctx.stroke();

                        // Блик
                        ctx.beginPath();
                        ctx.arc(
                            b.x - b.r * 0.32,
                            b.y - b.r * 0.32,
                            b.r * 0.24,
                            0,
                            Math.PI * 2,
                        );
                        ctx.fillStyle = `rgba(${r}, ${g}, ${bl}, ${b.alpha * 0.8})`;
                        ctx.fill();

                        if (b.y < -b.r * 3) {
                            Object.assign(b, makeBubble());
                        }
                    }
                    requestAnimationFrame(draw);
                }
                draw();
            })();
        </script>

        <script src="js/config.js"></script>
        <script src="js/api.js"></script>
        <script src="js/app.js"></script>
        <script>
            console.warn(
                "Да, это полностью вайб код собранный на коленке, еще и на открытом ресурсе. Защиты особо нет, как и каких-то важных персональных данных. Не ломай пожалуйста :) ",
            );
        </script>
    </body>
</html>
